[project]
name = "orbit8d"
version = "0.1.0"
description = "Orbit 8D：分轨 + HRTF 的可交互 8D 音乐制作工具（本地后台）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.12",
    "h5py>=3.10",
    "pyloudnorm>=0.1.1",
    "demucs>=4.1.0",  # 4.1 起有 HuggingFace 模型加载与分轨进度回调
    "huggingface-hub>=0.25",  # 查本机已有的模型缓存（demucs 也用它）
    "pyyaml>=6",  # 读模型组合配置
    "torch<2.9",
    "torchaudio<2.9",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false
# 支持的平台（README：Apple Silicon 的 macOS、Linux）；Intel Mac 上 demucs 4.1 与 numpy 2 冲突，装不上
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: 需要真实 HRTF 数据或较长计算的测试",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
