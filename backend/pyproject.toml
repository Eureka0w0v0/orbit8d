[project]
name = "orbit8d"
version = "0.1.0"
description = "Orbit 8D：分轨 + HRTF 的可交互 8D 音乐制作工具（本地后台）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.12",
    "h5py>=3.10",
    "pyloudnorm>=0.1.1",
    "demucs>=4.0.1",
    "torch<2.9",
    "torchaudio<2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: 需要真实 HRTF 数据或较长计算的测试",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
